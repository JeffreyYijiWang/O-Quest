name: quest-loadtest

services:
  postgres:
    image: postgres:17-alpine
    container_name: quest-load-postgres
    environment:
      POSTGRES_USER: quest
      POSTGRES_PASSWORD: quest
      POSTGRES_DB: postgres
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quest -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - quest-postgres:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    container_name: quest-load-redis
    command: ["redis-server", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    container_name: quest-load-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: quest-minio
      MINIO_ROOT_PASSWORD: quest-minio-secret
    ports:
      - "59000:9000"
      - "59001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - quest-minio:/data

volumes:
  quest-postgres:
  quest-minio:
