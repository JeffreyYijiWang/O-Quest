[package]
name = "backend"
version = "2.0.0"
license = "MIT OR Apache-2.0"
edition = "2024"
rust-version = "1.88"
default-run = "backend"

[[bin]]
name = "backend"
path = "src/main.rs"

[[bin]]
name = "seed"
path = "src/bin/seed.rs"

[[bin]]
name = "qr-export"
path = "src/bin/qr-export.rs"

[dependencies]
async-trait = "0.1"
axum = { version = "0.8.4", features = ["macros"] }
base64 = "0.22.1"
chrono = { version = "0.4.41", features = ["serde"] }
csv = "1.3.1"
dotenvy = "0.15.7"
flate2 = "1.1.2"
hmac = "0.12.1"
minio = "0.3.0"
moka = { version = "0.12", features = ["future"] }
rust_decimal = "1.37.2"
sea-orm = { version = "1.1.14", features = [
	"sqlx-postgres",
	"runtime-tokio-rustls",
	"macros",
] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
sha2 = "0.10.9"
tokio = { version = "1.47.0", features = ["full"] }
tower = "0.5.2"
tower-http = { version = "0.6.6", features = ["cors"] }
utoipa = { version = "5.4.0", features = [
	"axum_extras",
	"chrono",
	"uuid",
	"decimal_float",
] }
utoipa-axum = "0.2.0"
url = "2.5.4"
uuid = { version = "1.17.0", features = ["v4"] }
