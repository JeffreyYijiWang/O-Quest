name: quest-prototype

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: quest
      POSTGRES_PASSWORD: quest
      POSTGRES_DB: quest
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quest -d quest"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - quest-prototype-postgres:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: quest-minio
      MINIO_ROOT_PASSWORD: quest-minio-secret
    ports:
      - "59000:9000"
      - "59001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - quest-prototype-minio:/data

  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 quest-minio quest-minio-secret &&
      mc mb --ignore-existing local/quest
      "
    restart: "no"

  migrate:
    build:
      context: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://quest:quest@postgres:5432/quest
    command: ["migration", "up"]
    restart: "no"

  seed:
    build:
      context: ./backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://quest:quest@postgres:5432/quest
      DATABASE_MAX_CONNECTIONS: "8"
      DATABASE_MIN_CONNECTIONS: "1"
    working_dir: /app
    volumes:
      - ./prototype-data:/app/data:ro
    command: ["seed"]
    restart: "no"

  backend:
    build:
      context: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://quest:quest@postgres:5432/quest
      DATABASE_MAX_CONNECTIONS: "64"
      DATABASE_MIN_CONNECTIONS: "8"
      REDIS_URL: redis://redis:6379
      REDIS_POOL_SIZE: "24"
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: quest-minio
      MINIO_SECRET_KEY: quest-minio-secret
      MINIO_BUCKET: quest
      SESSION_SECRET: prototype-local-session-secret-32-bytes-minimum
      SESSION_TTL_SECONDS: "43200"
      SESSION_COOKIE_SECURE: "false"
      SESSION_COOKIE_SAME_SITE: Lax
      ALLOW_SELF_REGISTRATION: "true"
      ALLOW_DEV_AUTH: "true"
      LOAD_TEST_MODE: "false"
      ALLOWED_REDIRECT_ORIGINS: http://localhost:8080,http://127.0.0.1:8080,http://localhost:1420,http://tauri.localhost,tauri://localhost
      CORS_ALLOWED_ORIGINS: http://localhost:8080,http://127.0.0.1:8080,http://localhost:1420,http://tauri.localhost,tauri://localhost
    ports:
      - "3000:3000"

  frontend:
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_started
    ports:
      - "8080:80"

  qr-code-gen:
    build:
      context: ./qr-code-gen
      args:
        VITE_DATA_BASE64: 
    ports:
      - "8081:80"

volumes:
  quest-prototype-postgres:
  quest-prototype-minio:
